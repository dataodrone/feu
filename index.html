<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8a1017">
<title>Feux & fumées — heatmap 24 h</title>
<style>
html,body{height:100%;margin:0;background:#07131e;color:#f4f7f9;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{display:grid;place-items:center}
.loader{display:grid;place-items:center;gap:14px;text-align:center;padding:24px}
.loader i{width:42px;height:42px;border:4px solid rgba(255,255,255,.18);border-top-color:#e3343d;border-radius:50%;animation:spin .8s linear infinite}
.loader strong{font-size:14px}
.loader span{font-size:11px;color:#9dafbb}
.error{max-width:480px;padding:28px;text-align:center}
.error h1{font-size:22px}
.error p{color:#b9c8d0;line-height:1.5}
.error button{border:0;border-radius:8px;background:#b21720;color:#fff;padding:11px 16px;font-weight:800}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="loader"><i></i><strong>Chargement de la carte</strong><span>Activation de la heatmap des points chauds sur 24 h…</span></div>
<script>

'use strict';
const SOURCE_URLS=["https://raw.githubusercontent.com/dataodrone/feu/a07f86d12f91c640ee6330c0b09000db0e05cbc6/index.html", "https://cdn.jsdelivr.net/gh/dataodrone/feu@a07f86d12f91c640ee6330c0b09000db0e05cbc6/index.html"];
const OLD_LAYER="        <label class=\"layer-row\"><input type=\"checkbox\" data-layer=\"satellite\" checked><span><b>Activité des foyers satellite</b><small>NASA FIRMS NRT · rouge &lt; 3 h · orange 3–6 h · jaune à confirmer</small></span><span class=\"layer-state\">AUTO</span></label>";
const NEW_LAYER="        <label class=\"layer-row\"><input type=\"checkbox\" data-layer=\"hotspotHeatmap\" checked><span><b>Heatmap — points chauds actifs 24 h</b><small>Densité pondérée par récence · rouge = zones les plus récentes et les plus denses</small></span><span class=\"layer-state\" id=\"hotspotHeatStatus\">24 H</span></label>";
const HEATMAP_MODULE="\n/* ===== Heatmap des points chauds actifs des dernières 24 h ===== */\nstate.hotspotHeatLayer=null;\n\nfunction hotspotHeatRows(){\n  const nowMs=Date.now(),cutoff=nowMs-24*3600000;\n  return (state.satellitePoints||[])\n    .map(p=>({...p,timestamp:p.timestamp||hotspotTime(p)}))\n    .filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lng)&&Number.isFinite(p.timestamp)&&p.timestamp>=cutoff&&p.timestamp<=nowMs+15*60000)\n}\nfunction hotspotHeatWeight(p){\n  const ageHours=Math.max(0,(Date.now()-p.timestamp)/3600000);\n  const recency=Math.max(0,1-ageHours/24);\n  return Math.max(.06,Math.pow(recency,2.35))\n}\nfunction hotspotHeatColor(t){\n  const stops=[\n    [0,[43,131,186]],[.28,[0,188,212]],[.52,[255,228,92]],[.74,[255,138,0]],[1,[215,25,32]]\n  ];\n  const value=Math.max(0,Math.min(1,t));\n  for(let i=1;i<stops.length;i++){\n    if(value<=stops[i][0]){\n      const [p0,c0]=stops[i-1],[p1,c1]=stops[i],r=(value-p0)/(p1-p0||1);\n      return c0.map((v,j)=>Math.round(v+(c1[j]-v)*r))\n    }\n  }\n  return stops[stops.length-1][1]\n}\nfunction createHotspotHeatLayer(){\n  const HeatLayer=L.Layer.extend({\n    initialize(options={}){L.setOptions(this,options);this._points=[];this._scale=.72},\n    onAdd(map){\n      this._map=map;\n      this._canvas=L.DomUtil.create('canvas','leaflet-layer hotspot-heat-canvas');\n      this._canvas.style.position='absolute';\n      this._canvas.style.pointerEvents='none';\n      this._canvas.style.opacity=String(this.options.opacity||.86);\n      map.getPanes().heatmapPane.appendChild(this._canvas);\n      map.on('moveend zoomend resize',this._reset,this);\n      this._reset()\n    },\n    onRemove(map){\n      map.off('moveend zoomend resize',this._reset,this);\n      this._canvas?.remove();\n      this._canvas=null;\n      this._map=null\n    },\n    setPoints(points){this._points=points||[];this._redraw();return this},\n    _reset(){\n      if(!this._map||!this._canvas)return;\n      const size=this._map.getSize(),topLeft=this._map.containerPointToLayerPoint([0,0]);\n      L.DomUtil.setPosition(this._canvas,topLeft);\n      this._canvas.style.width=size.x+'px';\n      this._canvas.style.height=size.y+'px';\n      this._canvas.width=Math.max(1,Math.round(size.x*this._scale));\n      this._canvas.height=Math.max(1,Math.round(size.y*this._scale));\n      this._redraw()\n    },\n    _redraw(){\n      if(!this._map||!this._canvas)return;\n      const width=this._canvas.width,height=this._canvas.height,scale=this._scale;\n      const ctx=this._canvas.getContext('2d',{willReadFrequently:true});\n      ctx.clearRect(0,0,width,height);\n      if(!this._points.length)return;\n\n      const heat=document.createElement('canvas');\n      heat.width=width;heat.height=height;\n      const hctx=heat.getContext('2d');\n      const zoom=this._map.getZoom();\n      const radiusCss=zoom<7?28:zoom<9?34:zoom<11?40:33;\n      const radius=radiusCss*scale;\n\n      for(const p of this._points){\n        const cp=this._map.latLngToContainerPoint([p.lat,p.lng]);\n        const x=cp.x*scale,y=cp.y*scale;\n        if(x<-radius||y<-radius||x>width+radius||y>height+radius)continue;\n        const weight=hotspotHeatWeight(p);\n        const alpha=Math.min(.78,.11+.67*weight);\n        const gradient=hctx.createRadialGradient(x,y,0,x,y,radius);\n        gradient.addColorStop(0,`rgba(0,0,0,${alpha})`);\n        gradient.addColorStop(.38,`rgba(0,0,0,${alpha*.58})`);\n        gradient.addColorStop(1,'rgba(0,0,0,0)');\n        hctx.fillStyle=gradient;\n        hctx.fillRect(x-radius,y-radius,radius*2,radius*2)\n      }\n\n      const density=hctx.getImageData(0,0,width,height);\n      const output=ctx.createImageData(width,height);\n      const src=density.data,dst=output.data;\n      for(let i=0;i<src.length;i+=4){\n        const a=src[i+3];\n        if(!a)continue;\n        const intensity=Math.min(1,Math.pow(a/255,.72)*1.12);\n        const [r,g,b]=hotspotHeatColor(intensity);\n        dst[i]=r;dst[i+1]=g;dst[i+2]=b;dst[i+3]=Math.min(235,Math.round(45+a*.9))\n      }\n      ctx.putImageData(output,0,0)\n    }\n  });\n  return new HeatLayer({opacity:.88})\n}\nfunction updateHotspotHeatStatus(count){\n  const el=$('#hotspotHeatStatus');\n  if(el)el.textContent=count?`${count} PT`:'0 PT'\n}\nfunction removeHotspotHeat2d(){\n  if(state.hotspotHeatLayer&&state.map?.hasLayer(state.hotspotHeatLayer))state.map.removeLayer(state.hotspotHeatLayer)\n}\nasync function renderHotspotHeatmap(){\n  const rows=hotspotHeatRows();\n  updateHotspotHeatStatus(rows.length);\n  if(state.is3d){removeHotspotHeat2d();renderHotspotHeatmap3d();return}\n  if(!state.map||!selected('hotspotHeatmap')||!rows.length){removeHotspotHeat2d();return}\n  if(!state.hotspotHeatLayer)state.hotspotHeatLayer=createHotspotHeatLayer();\n  state.hotspotHeatLayer.setPoints(rows);\n  if(!state.map.hasLayer(state.hotspotHeatLayer))state.hotspotHeatLayer.addTo(state.map)\n}\nfunction renderHotspotHeatmap3d(){\n  if(!state.map3d||!state.map3d.loaded())return;\n  const id='hotspot-heatmap-24h',rows=hotspotHeatRows();\n  const data={type:'FeatureCollection',features:rows.map(p=>({\n    type:'Feature',\n    geometry:{type:'Point',coordinates:[p.lng,p.lat]},\n    properties:{weight:hotspotHeatWeight(p)}\n  }))};\n  try{\n    if(state.map3d.getSource(id))state.map3d.getSource(id).setData(data);\n    else state.map3d.addSource(id,{type:'geojson',data});\n    if(!state.map3d.getLayer(id)){\n      const before=(state.map3d.getStyle()?.layers||[]).find(l=>l.type==='symbol')?.id;\n      state.map3d.addLayer({\n        id,type:'heatmap',source:id,maxzoom:16,\n        paint:{\n          'heatmap-weight':['get','weight'],\n          'heatmap-intensity':['interpolate',['linear'],['zoom'],4,.65,10,1.25,15,1.7],\n          'heatmap-radius':['interpolate',['linear'],['zoom'],4,10,8,22,13,42],\n          'heatmap-opacity':['interpolate',['linear'],['zoom'],4,.7,15,.9],\n          'heatmap-color':['interpolate',['linear'],['heatmap-density'],\n            0,'rgba(43,131,186,0)',.18,'#2b83ba',.38,'#00bcd4',\n            .58,'#ffe45c',.78,'#ff8a00',1,'#d71920']\n        }\n      },before)\n    }\n    state.map3d.setLayoutProperty(id,'visibility',selected('hotspotHeatmap')?'visible':'none')\n  }catch(e){console.warn('Heatmap 3D FIRMS',e)}\n  updateHotspotHeatStatus(rows.length)\n}\n\nconst hotspotHeatOriginalInitMap=initMap;\ninitMap=function(){\n  hotspotHeatOriginalInitMap();\n  if(!state.map.getPane('heatmapPane')){\n    const pane=state.map.createPane('heatmapPane');\n    pane.style.zIndex='545';\n    pane.style.pointerEvents='none'\n  }\n};\n\nconst hotspotHeatOriginalSync2D=sync2DLayers;\nsync2DLayers=function(){\n  hotspotHeatOriginalSync2D();\n  if(!state.map||state.is3d)return;\n  if(!selected('hotspotHeatmap'))removeHotspotHeat2d();\n  else if(state.hotspotHeatLayer&&!state.map.hasLayer(state.hotspotHeatLayer))state.hotspotHeatLayer.addTo(state.map)\n};\n\nconst hotspotHeatOriginalLoadSatellite=loadSatellite;\nloadSatellite=async function(){\n  const result=await hotspotHeatOriginalLoadSatellite.apply(this,arguments);\n  await renderHotspotHeatmap();\n  return result\n};\n\nconst hotspotHeatOriginalRender3d=render3dData;\nrender3dData=function(){\n  hotspotHeatOriginalRender3d();\n  renderHotspotHeatmap3d()\n};\n\nconst hotspotHeatOriginalRefresh=refreshVisibleData;\nrefreshVisibleData=async function(manual=true){\n  const result=await hotspotHeatOriginalRefresh(manual);\n  if(selected('hotspotHeatmap')&&!selected('satellite')&&!selected('measuredFootprints'))await loadSatellite();\n  else await renderHotspotHeatmap();\n  return result\n};\n\nconst hotspotHeatOriginalChangeTerritory=changeTerritory;\nchangeTerritory=async function(value){\n  const result=await hotspotHeatOriginalChangeTerritory(value);\n  if(selected('hotspotHeatmap')&&!selected('satellite')&&!selected('measuredFootprints'))await loadSatellite();\n  else await renderHotspotHeatmap();\n  return result\n};\n\nconst hotspotHeatOriginalWire=wire;\nwire=function(){\n  hotspotHeatOriginalWire();\n  const cb=$('[data-layer=\"hotspotHeatmap\"]');\n  if(cb)cb.onchange=async()=>{\n    if(cb.checked){\n      if(!state.satellitePoints.length)await loadSatellite();\n      else await renderHotspotHeatmap()\n    }else{\n      removeHotspotHeat2d();\n      renderHotspotHeatmap3d()\n    }\n    sync2DLayers()\n  }\n};\n\nconst hotspotHeatOriginalBoot=boot;\nboot=async function(){\n  const result=await hotspotHeatOriginalBoot();\n  setTimeout(()=>{\n    if(!selected('hotspotHeatmap'))return;\n    if(!state.satellitePoints.length&&!selected('satellite')&&!selected('measuredFootprints'))loadSatellite();\n    else renderHotspotHeatmap()\n  },1100);\n  return result\n};\n";

const OLD_BURN_LAYER="        <label class=\"layer-row\"><input type=\"checkbox\" data-layer=\"measuredFootprints\" checked><span><b>Périmètre du foyer</b><small>Empreinte calculée des pixels chauds FIRMS · contour non officiel</small></span><i class=\"layer-swatch intent-perimeter-swatch\"></i></label>";
const NEW_BURN_LAYER="        <label class=\"layer-row\"><input type=\"checkbox\" data-layer=\"googleBurnedExtent\" checked><span><b>Emprise brûlée estimée</b><small>Équivalent public de la couche Google · Copernicus EMSR899, repli EFFIS NRT</small></span><span class=\"layer-state\" id=\"googleBurnedStatus\">CEMS</span></label>";
const BURN_MODULE="\n/* ===== Emprise brûlée estimée : Copernicus EMSR899 + repli EFFIS ===== */\nconst GOOGLE_EQUIVALENT_BURN_API='https://rapidmapping.emergency.copernicus.eu/backend/dashboard-api/public-activations/?code=EMSR899';\nconst GOOGLE_EQUIVALENT_BURN_VIEWER='https://mapping.emergency.copernicus.eu/activations/EMSR899';\nconst GOOGLE_EQUIVALENT_VECTORGRID='https://cdn.jsdelivr.net/npm/leaflet.vectorgrid@1.3.0/dist/Leaflet.VectorGrid.bundled.js';\n\nstate.googleBurnedGroup=null;\nstate.googleBurnedWms=null;\nstate.googleBurnedGeojson={type:'FeatureCollection',features:[]};\nstate.googleBurnedVectorSpecs=[];\nstate.googleBurnedLoaded=false;\nstate.googleBurnedLoading=null;\nstate.googleBurnedMeta=null;\n\nfunction googleBurnedStatus(text,title=''){\n  const el=$('#googleBurnedStatus');\n  if(el){el.textContent=text;el.title=title||text}\n}\nfunction googleBurnedText(properties={}){\n  try{return JSON.stringify(properties).toLowerCase()}catch{return''}\n}\nfunction googleBurnedStyle(properties={}){\n  const t=googleBurnedText(properties);\n  const possible=/(possible|possibly|probable|potential|uncertain|peut.?être|maybe)/i.test(t);\n  return{\n    stroke:true,\n    color:possible?'#f6a51c':'#f2a33a',\n    weight:2.2,\n    opacity:.98,\n    dashArray:possible?'7 5':'5 4',\n    fill:true,\n    fillColor:possible?'#e88a1d':'#a82c2c',\n    fillOpacity:possible?.23:.42\n  }\n}\nfunction googleBurnedPopup(properties={},meta=state.googleBurnedMeta){\n  const rows=Object.entries(properties||{}).filter(([,v])=>v!==null&&v!==''&&typeof v!=='object').slice(0,7);\n  const details=rows.map(([k,v])=>`<div><b>${esc(k)}</b> : ${esc(v)}</div>`).join('');\n  const area=meta?.areaHa?`<div>Surface cartographiée : <b>${Number(meta.areaHa).toLocaleString('fr-FR')} ha</b></div>`:'';\n  const updated=meta?.updated?`<div class=\"popup-meta\">Mise à jour Copernicus : ${esc(new Intl.DateTimeFormat('fr-FR',{dateStyle:'short',timeStyle:'short'}).format(new Date(meta.updated)))}</div>`:'';\n  return`<div class=\"popup-title\">Emprise brûlée estimée</div>${area}${details}${updated}<div class=\"popup-meta\">Source publique utilisée à la place de la couche propriétaire Google : Copernicus EMS Rapid Mapping EMSR899.</div><div class=\"popup-actions\"><a href=\"${GOOGLE_EQUIVALENT_BURN_VIEWER}\" target=\"_blank\" rel=\"noopener\">Ouvrir Copernicus EMSR899</a></div>`\n}\nfunction googleBurnedAreaHa(product,activation){\n  const direct=product?.stats?.['Burnt area']?.None?.affected;\n  if(Number.isFinite(Number(direct)))return Number(direct);\n  const eventExtent=activation?.stats?.['Event Extent [ha]'];\n  return Number.isFinite(Number(eventExtent))?Number(eventExtent):null\n}\nfunction googleBurnedProductTime(product){\n  return Date.parse(product?.version?.deliveryTime||product?.expectedDelivery||0)||0\n}\nfunction googleBurnedLatestProducts(activation){\n  const byAoi=new Map();\n  for(const aoi of activation?.aois||[]){\n    for(const product of aoi.products||[]){\n      if(product?.feasible===false||product?.version?.statusCode&&product.version.statusCode!=='F')continue;\n      const observed=(product.layers||[]).some(l=>/observedEventA/i.test(l?.name||''));\n      if(!observed)continue;\n      const key=String(product.aoiNumber||aoi.number||aoi.name||'1');\n      const previous=byAoi.get(key);\n      if(!previous||googleBurnedProductTime(product)>googleBurnedProductTime(previous))byAoi.set(key,product)\n    }\n  }\n  return[...byAoi.values()].sort((a,b)=>googleBurnedProductTime(b)-googleBurnedProductTime(a))\n}\nfunction googleBurnedCandidateUrls(layer,bucket){\n  const out=[];\n  const add=url=>{if(typeof url==='string'&&/^https?:\\/\\//i.test(url)&&!out.includes(url))out.push(url)};\n  add(layer?.json);\n  add(layer?.url);\n  add(layer?.href);\n  if(bucket&&layer?.name){\n    const root=String(bucket).replace(/\\/$/,'')+'/'+String(layer.name).replace(/^\\//,'');\n    add(root+'.json');\n    add(root.replace(/_VT$/i,'')+'.json');\n    add(root+'/tilejson.json');\n    add(root+'/tiles.json')\n  }\n  return out\n}\nasync function googleBurnedJson(url){\n  const response=await fetchWithTimeout(url+(url.includes('?')?'&':'?')+'_='+Date.now(),12000);\n  return response.json()\n}\nasync function ensureGoogleBurnedVectorGrid(){\n  if(L.vectorGrid?.protobuf)return;\n  await loadScript(GOOGLE_EQUIVALENT_VECTORGRID,'leaflet-vectorgrid-runtime',9000);\n  if(!L.vectorGrid?.protobuf)throw new Error('Leaflet.VectorGrid indisponible')\n}\nfunction googleBurnedVectorStyles(tilejson={}){\n  const styles={},ids=(tilejson.vector_layers||[]).map(x=>x.id).filter(Boolean);\n  for(const id of ids)styles[id]=properties=>googleBurnedStyle(properties);\n  if(!ids.length)styles.sliced=properties=>googleBurnedStyle(properties);\n  return styles\n}\nfunction googleBurnedCombineGeojson(target,data){\n  if(!data)return;\n  if(data.type==='FeatureCollection'&&Array.isArray(data.features))target.features.push(...data.features);\n  else if(data.type==='Feature')target.features.push(data);\n  else if(['Polygon','MultiPolygon'].includes(data.type))target.features.push({type:'Feature',geometry:data,properties:{}})\n}\nasync function googleBurnedLoadLayer(layer,bucket,product){\n  const urls=googleBurnedCandidateUrls(layer,bucket);\n  let lastError=null;\n  for(const url of urls){\n    try{\n      const data=await googleBurnedJson(url);\n      if(data?.type==='FeatureCollection'||data?.type==='Feature'||['Polygon','MultiPolygon'].includes(data?.type)){\n        googleBurnedCombineGeojson(state.googleBurnedGeojson,data);\n        const geo=L.geoJSON(data,{\n          pane:'googleBurnedPane',\n          style:f=>googleBurnedStyle(f.properties),\n          onEachFeature:(f,l)=>l.bindPopup(googleBurnedPopup(f.properties))\n        });\n        geo.addTo(state.googleBurnedGroup);\n        return true\n      }\n      if(Array.isArray(data?.tiles)&&data.tiles.length){\n        await ensureGoogleBurnedVectorGrid();\n        const spec={\n          tiles:data.tiles,\n          minzoom:data.minzoom||0,\n          maxzoom:data.maxzoom||16,\n          sourceLayers:(data.vector_layers||[]).map(x=>x.id).filter(Boolean),\n          tilejsonUrl:url\n        };\n        state.googleBurnedVectorSpecs.push(spec);\n        const vector=L.vectorGrid.protobuf(data.tiles[0],{\n          pane:'googleBurnedPane',\n          interactive:true,\n          maxNativeZoom:spec.maxzoom,\n          vectorTileLayerStyles:googleBurnedVectorStyles(data),\n          getFeatureId:f=>f.properties?.id||f.properties?.fid||f.properties?.objectid\n        });\n        vector.on('click',e=>{\n          L.popup().setLatLng(e.latlng).setContent(googleBurnedPopup(e.layer?.properties||e.propagatedFrom?.properties||{})).openOn(state.map)\n        });\n        vector.addTo(state.googleBurnedGroup);\n        return true\n      }\n    }catch(error){lastError=error}\n  }\n  if(lastError)console.debug('Couche Copernicus non chargée',layer?.name,lastError);\n  return false\n}\nfunction ensureGoogleBurnedWms(){\n  if(state.googleBurnedWms)return state.googleBurnedWms;\n  state.googleBurnedWms=L.tileLayer.wms(CONFIG.effisWms,{\n    layers:'nrt.ba.today',\n    format:'image/png',\n    transparent:true,\n    version:'1.1.1',\n    time:dateRange(3),\n    opacity:.84,\n    pane:'googleBurnedPane',\n    updateWhenIdle:true,\n    keepBuffer:1,\n    attribution:'Copernicus EFFIS NRT'\n  });\n  state.googleBurnedWms.on('load',()=>googleBurnedStatus('EFFIS','Repli Copernicus EFFIS NRT'));\n  state.googleBurnedWms.on('tileerror',()=>googleBurnedStatus('PARTIEL','Emprise Copernicus temporairement partielle'));\n  return state.googleBurnedWms\n}\nfunction syncGoogleBurned2d(){\n  if(!state.map||state.is3d)return;\n  const on=selected('googleBurnedExtent');\n  if(state.googleBurnedGroup){\n    if(on&&state.googleBurnedGroup.getLayers().length&&!state.map.hasLayer(state.googleBurnedGroup))state.googleBurnedGroup.addTo(state.map);\n    if(!on&&state.map.hasLayer(state.googleBurnedGroup))state.map.removeLayer(state.googleBurnedGroup)\n  }\n  if(state.googleBurnedWms){\n    const useFallback=on&&(!state.googleBurnedGroup||!state.googleBurnedGroup.getLayers().length);\n    if(useFallback&&!state.map.hasLayer(state.googleBurnedWms))state.googleBurnedWms.addTo(state.map);\n    if(!useFallback&&state.map.hasLayer(state.googleBurnedWms))state.map.removeLayer(state.googleBurnedWms)\n  }\n}\nasync function loadGoogleBurnedExtent(manual=false,force=false){\n  if(state.googleBurnedLoading&&!force)return state.googleBurnedLoading;\n  state.googleBurnedLoading=(async()=>{\n    if(!state.googleBurnedGroup)return;\n    googleBurnedStatus('…','Chargement Copernicus EMSR899');\n    state.googleBurnedGroup.clearLayers();\n    state.googleBurnedGeojson={type:'FeatureCollection',features:[]};\n    state.googleBurnedVectorSpecs=[];\n    state.googleBurnedLoaded=false;\n    try{\n      const payload=await googleBurnedJson(GOOGLE_EQUIVALENT_BURN_API);\n      const activation=payload?.results?.[0]||payload;\n      if(!activation||activation.code!=='EMSR899')throw new Error('Activation EMSR899 indisponible');\n      const products=googleBurnedLatestProducts(activation);\n      if(!products.length)throw new Error('Produit de délimitation en attente');\n      const latest=products.reduce((a,b)=>googleBurnedProductTime(a)>googleBurnedProductTime(b)?a:b);\n      state.googleBurnedMeta={\n        code:activation.code,\n        name:activation.name,\n        updated:latest?.version?.deliveryTime||activation.lastUpdate||activation.activationTime,\n        areaHa:products.reduce((sum,p)=>sum+(googleBurnedAreaHa(p,activation)||0),0)||googleBurnedAreaHa(latest,activation),\n        reportLink:activation.reportLink\n      };\n      let loaded=0;\n      for(const product of products){\n        const layers=(product.layers||[]).filter(l=>/observedEventA/i.test(l?.name||''));\n        for(const layer of layers)if(await googleBurnedLoadLayer(layer,activation.aws_bucket,product))loaded++\n      }\n      if(!loaded)throw new Error('Géométrie Copernicus non encore publiée');\n      state.googleBurnedLoaded=true;\n      const area=state.googleBurnedMeta.areaHa;\n      googleBurnedStatus(area?`${Math.round(area).toLocaleString('fr-FR')} HA`:'CEMS',`Copernicus EMSR899${area?` · ${Math.round(area).toLocaleString('fr-FR')} ha`:''}`);\n      if(manual)toast('Emprise Copernicus EMSR899 actualisée.');\n    }catch(error){\n      console.warn('Copernicus EMSR899',error);\n      state.googleBurnedLoaded=false;\n      ensureGoogleBurnedWms();\n      googleBurnedStatus('EFFIS','Repli Copernicus EFFIS NRT');\n      if(manual)toast('Produit EMSR899 non accessible : emprise EFFIS NRT affichée.','warn')\n    }finally{\n      syncGoogleBurned2d();\n      renderGoogleBurned3d();\n      state.googleBurnedLoading=null\n    }\n  })();\n  return state.googleBurnedLoading\n}\nfunction googleBurnedSetVisibility(id,on){\n  if(!state.map3d?.getLayer(id))return;\n  state.map3d.setLayoutProperty(id,'visibility',on?'visible':'none')\n}\nfunction renderGoogleBurned3d(){\n  if(!state.map3d||!state.map3d.loaded())return;\n  const on=selected('googleBurnedExtent');\n  const geoId='cems-burn-geo';\n  try{\n    if(state.googleBurnedGeojson.features.length){\n      if(state.map3d.getSource(geoId))state.map3d.getSource(geoId).setData(state.googleBurnedGeojson);\n      else state.map3d.addSource(geoId,{type:'geojson',data:state.googleBurnedGeojson});\n      if(!state.map3d.getLayer(geoId+'-fill'))state.map3d.addLayer({id:geoId+'-fill',type:'fill',source:geoId,paint:{'fill-color':'#a82c2c','fill-opacity':.42}});\n      if(!state.map3d.getLayer(geoId+'-line'))state.map3d.addLayer({id:geoId+'-line',type:'line',source:geoId,paint:{'line-color':'#f2a33a','line-width':2.4,'line-dasharray':[2,1.4]}});\n    }\n    googleBurnedSetVisibility(geoId+'-fill',on&&state.googleBurnedGeojson.features.length);\n    googleBurnedSetVisibility(geoId+'-line',on&&state.googleBurnedGeojson.features.length);\n    state.googleBurnedVectorSpecs.forEach((spec,index)=>{\n      const sourceId='cems-burn-vt-'+index;\n      if(!state.map3d.getSource(sourceId))state.map3d.addSource(sourceId,{type:'vector',tiles:spec.tiles,minzoom:spec.minzoom,maxzoom:spec.maxzoom});\n      for(const sourceLayer of spec.sourceLayers){\n        const clean=String(sourceLayer).replace(/[^a-z0-9_-]+/gi,'-');\n        const fillId=sourceId+'-'+clean+'-fill',lineId=sourceId+'-'+clean+'-line';\n        if(!state.map3d.getLayer(fillId))state.map3d.addLayer({id:fillId,type:'fill',source:sourceId,'source-layer':sourceLayer,paint:{'fill-color':'#a82c2c','fill-opacity':.42}});\n        if(!state.map3d.getLayer(lineId))state.map3d.addLayer({id:lineId,type:'line',source:sourceId,'source-layer':sourceLayer,paint:{'line-color':'#f2a33a','line-width':2.4,'line-dasharray':[2,1.4]}});\n        googleBurnedSetVisibility(fillId,on);\n        googleBurnedSetVisibility(lineId,on)\n      }\n    })\n  }catch(error){console.debug('Emprise brûlée 3D',error)}\n}\n\nconst googleBurnedOriginalInitMap=initMap;\ninitMap=function(){\n  googleBurnedOriginalInitMap();\n  if(!state.map.getPane('googleBurnedPane')){\n    const pane=state.map.createPane('googleBurnedPane');\n    pane.style.zIndex='535';\n    pane.style.pointerEvents='auto'\n  }\n  state.googleBurnedGroup=L.layerGroup()\n};\n\nconst googleBurnedOriginalSync2D=sync2DLayers;\nsync2DLayers=function(){\n  googleBurnedOriginalSync2D();\n  syncGoogleBurned2d()\n};\n\nconst googleBurnedOriginalRender3d=render3dData;\nrender3dData=function(){\n  googleBurnedOriginalRender3d();\n  renderGoogleBurned3d()\n};\n\nconst googleBurnedOriginalRefresh=refreshVisibleData;\nrefreshVisibleData=async function(manual=true){\n  const result=await googleBurnedOriginalRefresh(manual);\n  if(selected('googleBurnedExtent'))await loadGoogleBurnedExtent(false,true);\n  return result\n};\n\nconst googleBurnedOriginalWire=wire;\nwire=function(){\n  googleBurnedOriginalWire();\n  const cb=$('[data-layer=\"googleBurnedExtent\"]');\n  if(cb)cb.onchange=async()=>{\n    if(cb.checked&&!state.googleBurnedLoaded)await loadGoogleBurnedExtent(true);\n    else{\n      syncGoogleBurned2d();\n      renderGoogleBurned3d()\n    }\n  }\n};\n\nconst googleBurnedOriginalBoot=boot;\nboot=async function(){\n  const result=await googleBurnedOriginalBoot();\n  setTimeout(()=>{if(selected('googleBurnedExtent'))loadGoogleBurnedExtent(false)},1350);\n  return result\n};\n";
async function fetchOriginal(){
  let lastError=null;
  for(const url of SOURCE_URLS){
    try{
      const response=await fetch(url,{cache:'no-store'});
      if(!response.ok)throw new Error('HTTP '+response.status);
      const html=await response.text();
      if(!html.includes('data-layer="satellite"')||!html.includes('\nboot();'))throw new Error('Version source non reconnue');
      return html
    }catch(error){lastError=error}
  }
  throw lastError||new Error('Source indisponible')
}
function patchApplication(html){
  if(!html.includes('data-layer="hotspotHeatmap"')){
    if(!html.includes(OLD_LAYER))throw new Error('Emplacement du gestionnaire de couches introuvable');
    html=html.replace(OLD_LAYER,OLD_LAYER+'\n'+NEW_LAYER)
  }
  if(!html.includes('Heatmap des points chauds actifs des dernières 24 h')){
    const bootPosition=html.lastIndexOf('\nboot();');
    if(bootPosition<0)throw new Error('Point de démarrage de l’application introuvable');
    html=html.slice(0,bootPosition)+'\n'+HEATMAP_MODULE+html.slice(bootPosition)
  }
  if(!html.includes('data-layer="googleBurnedExtent"')){
    if(!html.includes(OLD_BURN_LAYER))throw new Error('Emplacement de la couche de périmètre introuvable');
    html=html.replace(OLD_BURN_LAYER,OLD_BURN_LAYER+'\n'+NEW_BURN_LAYER)
  }
  if(!html.includes('Emprise brûlée estimée : Copernicus EMSR899')){
    const bootPosition=html.lastIndexOf('\nboot();');
    if(bootPosition<0)throw new Error('Point de démarrage de l’application introuvable');
    html=html.slice(0,bootPosition)+'\n'+BURN_MODULE+html.slice(bootPosition)
  }
  return html
}
(async()=>{
  try{
    const original=await fetchOriginal();
    const patched=patchApplication(original);
    document.open();
    document.write(patched);
    document.close()
  }catch(error){
    console.error(error);
    document.body.innerHTML='<main class="error"><h1>Chargement impossible</h1><p>La version source de l’application n’a pas pu être récupérée.</p><p>Vérifiez la connexion internet puis rechargez la page.</p><button onclick="location.reload()">RECHARGER</button></main>'
  }
})();
